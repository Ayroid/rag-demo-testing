[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ayroid", email = "ayushsk0000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=0.3.0",
    "openai>=2.53.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.7.0",
    "tqdm>=4.70.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
